<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Fetch{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Dark theme only (no light-theme toggle needed) - forced via
        // tailwind.config rather than relying on the OS/browser preference,
        // so it always looks the same regardless of the viewer's own setting.
        tailwind.config = { darkMode: "class" };
    </script>
</head>
<body class="dark bg-gray-900 text-gray-100 min-h-screen">
    <nav class="bg-gray-800 border-b border-gray-700">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center gap-x-6 gap-y-2">
            <span class="font-semibold tracking-tight text-gray-100">Fetch</span>
            <a href="/searches" class="text-gray-300 hover:text-white text-sm">Searches</a>
            <a href="/feed" class="text-gray-300 hover:text-white text-sm">Feed</a>
            <a href="/watched-items" class="text-gray-300 hover:text-white text-sm">Watched items</a>
            <a href="/marketplaces" class="text-gray-300 hover:text-white text-sm">Marketplaces</a>
            <a href="/health" class="text-gray-300 hover:text-white text-sm">Health</a>
        </div>
    </nav>
    <main class="max-w-5xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
