<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Fetch{% endblock %}</title>
    {% block head %}{% endblock %}
    <!-- A plain precompiled stylesheet (see tailwind.config.js and the
         Dockerfile's cssbuild stage), not the Play CDN <script> this used to
         load - that runtime JIT compiler is what made the wizard's prompt
         textarea feel laggy (backlog #26, confirmed 2026-10). -->
    <link rel="stylesheet" href="/static/tailwind.css">
    <!-- Hides a listing feedback form's detail input until an action is
         actually picked - plain CSS (:has(), no JS anywhere in this app),
         see _listing_table.html's feedback_cell macro. -->
    <style>.feedback-form:has(select[name="action"] option[value=""]:checked) .feedback-detail { display: none; }</style>
</head>
<body class="dark bg-gray-900 text-gray-100 min-h-screen">
    <nav class="bg-gray-800 border-b border-gray-700">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center gap-x-6 gap-y-2">
            <span class="font-semibold tracking-tight text-gray-100">Fetch</span>
            <a href="/searches" class="text-gray-300 hover:text-white text-sm">Searches</a>
            <a href="/feed" class="text-gray-300 hover:text-white text-sm">Feed</a>
            <a href="/watched-items" class="text-gray-300 hover:text-white text-sm">Watched items</a>
            <a href="/marketplaces" class="text-gray-300 hover:text-white text-sm">Marketplaces</a>
            <a href="/health" class="text-gray-300 hover:text-white text-sm">Health</a>
        </div>
    </nav>
    <main class="max-w-5xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
