{% extends "base.html" %}
{% block title %}{{ marketplace.display_name }}{% endblock %}
{% block content %}
<h1>{{ marketplace.display_name }}</h1>
<form method="post" action="{{ action_url }}">
    <fieldset>
        <legend>Polling</legend>
        <label>Poll interval (minutes) <span class="hint">(how often this marketplace's searches are fetched)</span>
            <input type="number" name="poll_interval_minutes" value="{{ config.poll_interval_minutes if config else marketplace.default_poll_interval_minutes }}">
        </label>
        <label>Request delay (seconds) <span class="hint">(pause between individual requests to this marketplace)</span>
            <input type="number" step="0.1" name="request_delay_seconds" value="{{ config.request_delay_seconds if config else marketplace.default_request_delay_seconds }}">
        </label>
    </fieldset>

    {% if marketplace.auth_fields %}
    <fieldset>
        <legend>Authentication</legend>
        {% for f in marketplace.auth_fields %}
        <label>{{ f.label }}
            {% if config and config.auth.get(f.key) %}
                <span class="hint">(currently set - leave blank to keep it)</span>
            {% endif %}
            <input type="{{ 'password' if f.secret else 'text' }}" name="auth__{{ f.key }}" value="" autocomplete="off">
        </label>
        {% endfor %}
    </fieldset>
    {% endif %}

    <div class="actions">
        <button type="submit">Save</button>
        <a class="button secondary" href="/marketplaces">Cancel</a>
    </div>
</form>
{% endblock %}
