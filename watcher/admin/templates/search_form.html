{% extends "base.html" %}
{% block title %}{{ "Edit" if is_edit else "New" }} search{% endblock %}
{% block content %}
<h1>{{ "Edit" if is_edit else "New" }} search</h1>
<form method="post" action="{{ action_url }}">
    <fieldset>
        <legend>Basics</legend>
        <label>Name<input type="text" name="name" value="{{ form.name }}" required></label>
        <label><input type="checkbox" name="enabled" {{ "checked" if form.enabled else "" }} style="width:auto;display:inline;"> Enabled</label>
        <label>Scope
            <select name="scope">
                <option value="local" {{ "selected" if form.scope == "local" else "" }}>Local (restrict to a location)</option>
                <option value="national" {{ "selected" if form.scope == "national" else "" }}>National (search everywhere)</option>
            </select>
        </label>
        <label>Location <span class="hint">(used to restrict local-scope searches, e.g. a city or region name)</span>
            <input type="text" name="location" value="{{ form.location }}">
        </label>
        <label><input type="checkbox" name="require_shipping" {{ "checked" if form.require_shipping else "" }} style="width:auto;display:inline;"> Require/prefer listings that ship <span class="hint">(mainly relevant for national scope)</span></label>
        <label>Max price (SEK) <span class="hint">(deterministic filter, applied before any AI scoring)</span>
            <input type="number" name="max_price" value="{{ form.max_price }}">
        </label>
        <label>Min price (SEK) <span class="hint">(deterministic filter - screens out suspiciously-cheap listings, e.g. a lone accessory rather than the item itself; leave blank for no floor)</span>
            <input type="number" name="min_price" value="{{ form.min_price }}">
        </label>
        <label><input type="checkbox" id="scoring_mode_rated" name="scoring_mode" value="rated" {{ "checked" if form.scoring_mode == "rated" else "" }} style="width:auto;display:inline;"> AI-rated <span class="hint">(off: a plain browsable list with no Claude involved, just the filters below - on: Claude also scores and reasons about every match using the criteria further down)</span></label>
    </fieldset>

    <fieldset id="plain-fields">
        <legend>Plain search alerting</legend>
        <label>Instant alert price (SEK) <span class="hint">(a match at or below this price pings Slack immediately instead of waiting for the daily digest; leave blank to only ever appear in the digest)</span>
            <input type="number" name="instant_alert_price" value="{{ form.instant_alert_price }}">
        </label>
    </fieldset>

    <fieldset>
        <legend>Deterministic prefilter</legend>
        <label>Excluded models <span class="hint">(wildcard patterns, one per line, e.g. TX-SR6*)</span>
            <textarea name="excluded_models">{{ form.excluded_models }}</textarea>
        </label>
        <label>Excluded words <span class="hint">(one per line, matched against title/description)</span>
            <textarea name="excluded_words">{{ form.excluded_words }}</textarea>
        </label>
        <label>Required keywords <span class="hint">(one per line; at least one must appear - leave empty to require none)</span>
            <textarea name="required_keywords">{{ form.required_keywords }}</textarea>
        </label>
    </fieldset>

    <fieldset id="rated-fields">
        <legend>Criteria for Claude's scoring</legend>
        <label>Hard requirements <span class="hint">(one per line, free text, e.g. "HDCP 2.2 passthrough required")</span>
            <textarea name="hard_criteria">{{ form.hard_criteria }}</textarea>
        </label>
        <label>Soft criteria / nice-to-haves <span class="hint">(one per line)</span>
            <textarea name="soft_criteria">{{ form.soft_criteria }}</textarea>
        </label>
        <label>Watched models <span class="hint">(one per line: <code>pattern | note | good price | ideal</code> - leave the last part blank for a normal watched model, or write <code>ideal</code> to mark it as your buy-it-now/grail target: if genuinely found at or below its good price, Claude scores it 10/10 and judges every other candidate in this search against it. e.g. <code>TX-NR6* | solid mid-range Onkyo | 1500-2500 SEK |</code> or <code>RTX 4080 | the one I actually want | 7000-8000 SEK | ideal</code>)</span>
            <textarea name="watched_models">{{ form.watched_models }}</textarea>
        </label>
    </fieldset>

    <fieldset>
        <legend>Search terms</legend>
        <label>Search phrases <span class="hint">(one per line - run on every marketplace selected below)</span>
            <textarea name="search_phrases">{{ form.search_phrases }}</textarea>
        </label>
        <label>Marketplaces
            {% for m in marketplaces %}
            <span style="display:block;">
                <input type="checkbox" name="marketplaces" value="{{ m.key }}" {{ "checked" if m.key in form.marketplaces else "" }} style="width:auto;display:inline;"> {{ m.display_name }}
            </span>
            {% else %}
            <span class="muted">No marketplaces registered.</span>
            {% endfor %}
        </label>
    </fieldset>

    <div class="actions">
        <button type="submit">Save</button>
        <a class="button secondary" href="/searches">Cancel</a>
    </div>
</form>
<script>
    // Progressive enhancement only - the "rated" vs "plain" fieldsets are both
    // submitted either way, so nothing breaks if this doesn't run.
    (function () {
        var ratedCheckbox = document.getElementById("scoring_mode_rated");
        var ratedFields = document.getElementById("rated-fields");
        var plainFields = document.getElementById("plain-fields");

        function sync() {
            var isRated = ratedCheckbox.checked;
            ratedFields.style.display = isRated ? "" : "none";
            plainFields.style.display = isRated ? "none" : "";
        }

        ratedCheckbox.addEventListener("change", sync);
        sync();
    })();
</script>
{% endblock %}
